services:
    _defaults:
        autowire: true
        autoconfigure: true

    Rallo\ContaoPdfImport\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Resources/'
            - '../src/ContaoManager/'
            - '../src/ContaoPdfImportBundle.php'

    # Aws\Textract\TextractClient via Factory (Region aus AWS_REGION env, Credentials aus AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY env)
    Aws\Textract\TextractClient:
        factory: ['@Rallo\ContaoPdfImport\Service\Ocr\TextractClientFactory', 'create']

    # Decorator-Chain (von innen nach außen):
    #   TextractOcrProvider  ← echter AWS-SDK-Aufruf
    #     ↑ wraps in
    #   CachingOcrProvider   ← sha1(imageBytes) Cache, setzt wasCached-Flag
    #     ↑ wraps in
    #   LoggingOcrProvider   ← schreibt 1 Event pro analyzePage in tl_pdf_import_event
    Rallo\ContaoPdfImport\Service\Ocr\CachingOcrProvider:
        arguments:
            $inner: '@Rallo\ContaoPdfImport\Service\Ocr\TextractOcrProvider'
            $cacheDir: '%kernel.project_dir%/var/cache/textract'

    Rallo\ContaoPdfImport\Service\Ocr\LoggingOcrProvider:
        arguments:
            $inner: '@Rallo\ContaoPdfImport\Service\Ocr\CachingOcrProvider'

    # Default-Binding: wer OcrProviderInterface injectet bekommt den äußersten Decorator (LoggingProvider)
    Rallo\ContaoPdfImport\Service\Ocr\OcrProviderInterface:
        alias: Rallo\ContaoPdfImport\Service\Ocr\LoggingOcrProvider
